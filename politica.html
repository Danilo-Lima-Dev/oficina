<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Política de privacidade</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="js/tema.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/estilo.css">
<style>
  .pol{max-width:760px;margin:0 auto;padding:32px 16px 64px}
  .pol header{display:flex;gap:14px;align-items:center;border-bottom:2px dashed var(--line);padding-bottom:18px;margin-bottom:8px}
  .pol header img{width:56px;height:56px;object-fit:contain;border-radius:var(--r)}
  .pol h1{font-size:2rem}
  .pol h2{font-size:1.25rem;margin:28px 0 6px;color:var(--accent)}
  .pol p,.pol li{line-height:1.65;max-width:70ch}
  .pol ul{padding-left:20px}
  .pol .meta{color:var(--muted);margin:4px 0 0}
  .pol .caixa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:10px}
  .pol .falta{color:var(--warn)}
</style>
</head>
<body>
<main class="pol" id="pol"><p>Carregando…</p></main>
<script src="js/config.js"></script>
<script src="js/politica.js"></script>
</body>
</html>
